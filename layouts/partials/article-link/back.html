{{- $sec := .FirstSection -}}
{{- if and $sec (ne $sec .) -}}
<div class="not-prose mt-10 flex flex-wrap gap-3">
  <a href="{{ $sec.RelPermalink }}" class="inline-flex items-center gap-2 rounded-xl border border-neutral-300 dark:border-neutral-600 bg-white dark:bg-neutral-800 px-4 py-2.5 text-sm font-semibold text-neutral-800 dark:text-neutral-100 no-underline shadow-[0_3px_0_0_rgba(0,0,0,.25),0_6px_12px_-4px_rgba(0,0,0,.35)] hover:-translate-y-0.5 hover:border-primary-500 active:translate-y-0.5 active:shadow-none transition"><span aria-hidden="true">←</span> 回「{{ $sec.Title }}」列表</a>
  <a href="{{ "/" | relURL }}" class="inline-flex items-center gap-2 rounded-xl border border-neutral-300 dark:border-neutral-600 bg-white dark:bg-neutral-800 px-4 py-2.5 text-sm font-semibold text-neutral-800 dark:text-neutral-100 no-underline shadow-[0_3px_0_0_rgba(0,0,0,.25),0_6px_12px_-4px_rgba(0,0,0,.35)] hover:-translate-y-0.5 hover:border-primary-500 active:translate-y-0.5 active:shadow-none transition">⌂ 首頁</a>
</div>
{{- end -}}
