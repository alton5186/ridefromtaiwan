{{- /* 嵌入 static/maps/<slug>.html 的路線圖:{{< iframe src="map.html" height="420" >}};src 給絕對路徑則照用 */ -}}
{{- $src := .Get "src" -}}
{{- if not (hasPrefix $src "/") -}}{{- $src = printf "maps/%s.html" (path.Base .Page.File.Dir) -}}{{- end -}}
<div class="not-prose my-6 rounded-lg overflow-hidden border border-neutral-200 dark:border-neutral-700">
  <iframe src="{{ $src | absURL }}" loading="lazy" style="width:100%;height:{{ .Get "height" | default "420" }}px;border:0;display:block" title="{{ .Get "title" | default "路線圖" }}"></iframe>
</div>
