# Ride from Taiwan — 站台設定
theme = "blowfish"
baseURL = "https://ridefromtaiwan.com/"
defaultContentLanguage = "zh-tw"
enableRobotsTXT = true
summaryLength = 40
buildDrafts = false
buildFuture = false
enableEmoji = true
hasCJKLanguage = true

[pagination]
  pagerSize = 12

[imaging]
  anchor = 'Center'
  [imaging.jpeg]
    quality = 66
  [imaging.webp]
    quality = 66

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"
  region = "regions"

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false
  [[related.indices]]
    name = "series"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "categories"
    weight = 50
